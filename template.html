<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
            line-height: 1.8;
            color: #1a1a1a;
            background: #f0f2f5;
            padding: 40px 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        /* 헤더 영역 */
        .header {
            background: linear-gradient(135deg, #2D3561 0%, #1F2544 50%, #0F0F23 100%);
            color: white;
            padding: 60px 50px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(94, 114, 235, 0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .department-name {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .newsletter-subtitle {
            font-size: 15px;
            opacity: 0.85;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* 본문 영역 */
        .content {
            padding: 60px 50px;
        }

        h1 {
            display: none;
        }

        /* 섹션 제목 스타일 */
        h2 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin: 50px 0 25px 0;
            padding-left: 20px;
            position: relative;
            letter-spacing: -0.3px;
        }

        h2:first-of-type {
            margin-top: 0;
        }

        h2::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 28px;
            background: linear-gradient(135deg, #5E72EB 0%, #8B5CF6 100%);
            border-radius: 3px;
        }

        /* 서브 섹션 */
        h3 {
            color: #2D3561;
            font-size: 18px;
            font-weight: 600;
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #5E72EB;
            border-radius: 50%;
            display: inline-block;
        }

        /* 문단 */
        p {
            margin-bottom: 18px;
            color: #4a4a4a;
            font-size: 15px;
            line-height: 1.8;
        }

        /* 리스트 스타일 */
        ul {
            margin: 20px 0 30px 0;
            padding-left: 0;
            list-style: none;
        }

        li {
            padding: 18px 24px;
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        li::before {
            content: '→';
            color: #5E72EB;
            font-weight: bold;
            margin-right: 12px;
            font-size: 18px;
        }

        li:hover {
            background: linear-gradient(135deg, #f8f9ff 0%, #ffffff 100%);
            border-color: #5E72EB;
            transform: translateX(4px);
            box-shadow: 0 4px 16px rgba(94, 114, 235, 0.15);
        }

        /* 강조 텍스트 */
        strong {
            color: #1a1a1a;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(94, 114, 235, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 이미지 */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin: 30px 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid #e8e8e8;
        }

        /* 인용문 스타일 (Markdown의 > 처리) */
        blockquote {
            margin: 25px 0;
            padding: 20px 25px;
            background: linear-gradient(135deg, #f8f9ff 0%, #faf5ff 100%);
            border-left: 4px solid #5E72EB;
            border-radius: 0 12px 12px 0;
            color: #4a4a4a;
            font-style: italic;
        }

        /* 구분선 */
        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin: 40px 0;
        }

        /* 링크 */
        a {
            color: #5E72EB;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #8B5CF6;
            border-bottom-color: #8B5CF6;
        }

        /* 정보 박스 (특별 공지용) */
        .info-box {
            background: linear-gradient(135deg, #EFF6FF 0%, #F0F9FF 100%);
            border-left: 4px solid #3B82F6;
            padding: 20px 25px;
            border-radius: 12px;
            margin: 25px 0;
        }

        /* 푸터 영역 */
        .footer {
            background: linear-gradient(to bottom, #fafafa, #f5f5f5);
            padding: 50px;
            border-top: 1px solid #e8e8e8;
        }

        .footer-title {
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #2D3561;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .contact-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e8e8e8;
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-color: #5E72EB;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #5E72EB 0%, #8B5CF6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin: 0 auto 12px;
        }

        .contact-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .contact-value {
            font-size: 14px;
            color: #2D3561;
            font-weight: 600;
        }

        .contact-value a {
            color: #2D3561;
            border: none;
        }

        .contact-value a:hover {
            color: #5E72EB;
        }

        .footer-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin: 30px 0 25px 0;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #888;
            line-height: 1.8;
        }

        .footer-copyright {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
        }

        /* 반응형 */
        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .container {
                border-radius: 16px;
            }

            .header {
                padding: 50px 30px;
            }

            .department-name {
                font-size: 26px;
            }

            .content {
                padding: 40px 30px;
            }

            .footer {
                padding: 40px 30px;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 22px;
                padding-left: 15px;
            }

            h3 {
                font-size: 17px;
            }

            li {
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo-badge">HOSEO UNIVERSITY</div>
                <div class="department-name">게임소프트웨어학과</div>
                <div class="newsletter-subtitle">Department Newsletter · {{ date }}</div>
            </div>
        </div>

        <div class="content">
            {{ content }}
        </div>

        <div class="footer">
            <div class="footer-title">Contact Information</div>

            <div class="contact-grid">
                <div class="contact-card">
                    <div class="contact-icon">✉</div>
                    <div class="contact-label">Email</div>
                    <div class="contact-value">game@hoseo.edu</div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon">☎</div>
                    <div class="contact-label">Phone</div>
                    <div class="contact-value">041-XXX-XXXX</div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon">🌐</div>
                    <div class="contact-label">Website</div>
                    <div class="contact-value"><a href="https://game.hoseo.ac.kr">game.hoseo.ac.kr</a></div>
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-text">
                본 뉴스레터는 호서대학교 게임소프트웨어학과 졸업생 여러분께<br>
                학과 소식을 전달하기 위해 발송되었습니다.
            </div>

            <div class="footer-copyright">
                © 2025 Hoseo University Dept. of Game Software
            </div>
        </div>
    </div>
</body>
</html>
